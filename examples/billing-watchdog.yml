# ==============================================================================
# Drop-in GitHub Actions workflow for Next.js, Drizzle, Prisma, Python FastAPI,
# Supabase/Postgres, Stripe & AI teams.
# Copy to .github/workflows/billing-watchdog.yml in YOUR repository.
#
# Zero exfiltration:
# - Pull requests run `verify-ci` (ProofTwin Zero-Credential Gate) with ZERO
#   database URLs and ZERO Stripe keys (safe on forked PRs and works out of the
#   box on the Free Diagnostic tier).
# - Optional Self-Hosted Pro v2 nightly live reconciliation (`reconcile` job
#   template commented out below) executes inside your own GitHub Actions runner,
#   reading Postgres in one REPEATABLE READ, READ ONLY transaction and Stripe
#   with a read-only restricted key (rk_*).
# ==============================================================================
name: Billing Integrity & ProofTwin Security Gate

on:
  workflow_dispatch:
    inputs:
      command:
        description: "ProofTwin CI gate command to run"
        required: false
        default: "verify-ci"
        type: choice
        options:
          - verify-ci
          - lint-sql
          - lint-code
  pull_request:
    paths:
      - "reconcile.config.json"
      - "supabase/migrations/**"
      - "drizzle/**"
      - "prisma/**"
      - "app/**"
      - "src/**"
      - ".mcp.json"

permissions:
  contents: read

jobs:
  prooftwin-pr-gate:
    # Zero-credential PR gate: checks SQL migrations, Drizzle/Prisma schemas,
    # multi-tenant RLS/SECURITY DEFINER policies, Stripe webhook raw-body HMAC
    # verification, LLM Denial-of-Wallet holds, and .mcp.json tool pinning.
    name: ProofTwin Zero-Credential PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run ProofTwin SQL, ORM, RLS, MCP & AI Route Gate
        uses: mariostosic0806/billing-watchdog@v2.4.2
        with:
          command: ${{ inputs.command || 'verify-ci' }}
          config-path: reconcile.config.json
          sql-path: supabase/migrations
          code-dir: src
          sarif-file: prooftwin.sarif
          agent-fix-file: prooftwin-agent-fix.md

      - name: Upload SARIF 2.1.0 annotations to GitHub Security
        if: always() && hashFiles('prooftwin.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prooftwin.sarif

