name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the oldest Node with TypeScript type stripping on by default (package.json engines).
        node: ["22.18", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Run full engine suite (private checkout) or public portal & Action security gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run typecheck
            npm test
            npm run lint-sql:example
            npm run verify-ci:demo
          else
            node -e '
              const fs = require("node:fs");
              const assert = require("node:assert/strict");
              for (const page of ["docs/index.html", "docs/calculator/index.html", "docs/saferevert/index.html", "action.yml", "examples/bad-migration.sql", "examples/billing-watchdog.yml"]) {
                assert.ok(fs.existsSync(page), "Missing public artifact: " + page);
              }
              const html = fs.readFileSync("docs/index.html", "utf8");
              assert.doesNotMatch(html, /BWV2-(?:LIFETIME_TEAM|PRO_MONTHLY)-[0-9]{4}-[0-9]{2}-[0-9]{2}T/);
              assert.doesNotMatch(html, /PRIVATE KEY|WATCHDOG_ED25519_PRIVATE_KEY/);
              assert.match(html, /PRIME_TECH_ED25519_PUBLIC_KEY_SPKI_B64/);
              assert.match(html, /verifyEd25519LicenseInBrowser/);
              assert.match(html, /REDACTED IN FREE DIAGNOSTIC MODE/);
              assert.match(html, /RLS_PERMISSIVE_NO_TENANT_FILTER/);
              const action = fs.readFileSync("action.yml", "utf8");
              const runBlocks = action.split("run: |").slice(1);
              for (const blk of runBlocks) {
                const scriptSection = blk.split(/\n    - name:/)[0];
                assert.doesNotMatch(scriptSection, /\$\{\{\s*inputs\./, "Shell injection guard: inputs must pass via env only");
              }
              const wf = fs.readFileSync("examples/billing-watchdog.yml", "utf8");
              for (const line of wf.split("\n").filter((l) => /^\s*(-\s+)?if:/.test(l))) {
                assert.doesNotMatch(line, /secrets\./, "Workflow if: must not reference secrets directly");
              }
              console.log("Public Portal & Composite Action CI Gate PASSED on Node " + process.version);
            '
            node scripts/public-ci-gate.mjs lint-sql --sql-file examples/bad-migration.sql --no-fail-on-critical --sarif-out /tmp/public-gate.sarif
            node -e '
              const fs = require("node:fs");
              const assert = require("node:assert/strict");
              const sarif = JSON.parse(fs.readFileSync("/tmp/public-gate.sarif", "utf8"));
              assert.equal(sarif.version, "2.1.0");
              assert.equal(sarif.runs.length, 1);
              assert.equal(sarif.runs[0].results.length, 5);
              for (const r of sarif.runs[0].results) {
                const loc = r.locations[0].physicalLocation;
                assert.equal(loc.artifactLocation.uri, "examples/bad-migration.sql");
                assert.ok(loc.region.startLine > 1);
              }
              console.log("Public SARIF 2.1.0 Smoke Gate PASSED (" + sarif.runs[0].results.length + " annotations)");
            '
          fi
