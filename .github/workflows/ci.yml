name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the oldest Node with TypeScript type stripping on by default (package.json engines).
        node: ["22.18", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Run full engine suite (private checkout) or public portal & Action security gate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run typecheck
            npm test
            npm run lint-sql:example
            npm run verify-ci:demo
            npm --prefix portal ci --no-audit --no-fund && npm --prefix portal run typecheck
          else
            npm --prefix portal ci --no-audit --no-fund
            npm --prefix portal run typecheck
            node -e '
              const fs = require("node:fs");
              const assert = require("node:assert/strict");
              for (const page of ["docs/index.html", "docs/terms.html", "docs/privacy.html", "docs/refund-policy.html", "action.yml", "examples/bad-migration.sql", "examples/billing-watchdog.yml", "skills/stripe-supabase-billing-guard/SKILL.md", "LICENSE", ".claude-plugin/marketplace.json", "plugins/billing-watchdog/.claude-plugin/plugin.json", "plugins/billing-watchdog/LICENSE", "plugins/billing-watchdog/README.md", "plugins/billing-watchdog/commands/audit.md", "plugins/billing-watchdog/skills/stripe-supabase-billing-guard/SKILL.md", "plugins/billing-watchdog/scripts/public-ci-gate.mjs"]) {
                assert.ok(fs.existsSync(page), "Missing public artifact: " + page);
              }
              assert.equal(
                fs.readFileSync("scripts/public-ci-gate.mjs", "utf8"),
                fs.readFileSync("plugins/billing-watchdog/scripts/public-ci-gate.mjs", "utf8"),
                "Plugin public-ci-gate.mjs drifted from root scripts/public-ci-gate.mjs"
              );
              assert.equal(
                fs.readFileSync("skills/stripe-supabase-billing-guard/SKILL.md", "utf8"),
                fs.readFileSync("plugins/billing-watchdog/skills/stripe-supabase-billing-guard/SKILL.md", "utf8"),
                "Plugin SKILL.md drifted from root skills/stripe-supabase-billing-guard/SKILL.md"
              );
              const walkPlugin = (dir) => {
                for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = dir + "/" + ent.name;
                  if (ent.isDirectory()) {
                    assert.notEqual(ent.name, "bin", "Plugin must not ship top-level bin/ directory");
                    walkPlugin(full);
                  } else {
                    const sz = fs.statSync(full).size;
                    assert.ok(sz < 262144, "Plugin file exceeds 256 KiB limit: " + full + " (" + sz + " B)");
                  }
                }
              };
              walkPlugin("plugins/billing-watchdog");
              const html = fs.readFileSync("docs/index.html", "utf8");
              const leakScan = ["docs/index.html", "docs/terms.html", "docs/privacy.html", "docs/refund-policy.html", ...fs.readdirSync("docs/assets").filter((f) => /\.(?:js|css)$/.test(f)).map((f) => "docs/assets/" + f)];
              for (const file of leakScan) {
                const txt = fs.readFileSync(file, "utf8");
                assert.doesNotMatch(txt, /BWV2-(?:LIFETIME_TEAM|PRO_MONTHLY|AGENCY_TEAM|AGENCY_CLIENT_HANDOVER)-(?:[0-9]{4}-[0-9]{2}-[0-9]{2}T|[0-9]{10,12}-[0-9A-F]{24})/, "Plaintext legacy BWV2 license key in " + file);
                assert.doesNotMatch(txt, /BWV2E-(?:LIFETIME_TEAM|PRO_MONTHLY|AGENCY_TEAM|AGENCY_CLIENT_HANDOVER)-(?:WATCHDOG_V2|BUNDLE_ALL)-[0-9]{10,12}-/, "Plaintext BWV2E Ed25519 license key in " + file);
                assert.doesNotMatch(txt, /PRIVATE KEY|WATCHDOG_ED25519_PRIVATE_KEY/, "Private key marker in " + file);
              }
              assert.match(html, /PRIME_TECH_ED25519_PUBLIC_KEY_SPKI_B64/);
              assert.match(html, /verifyEd25519LicenseInBrowser/);
              assert.match(html, /REDACTED IN FREE DIAGNOSTIC MODE/);
              assert.match(html, /RLS_PERMISSIVE_NO_TENANT_FILTER/);
              const action = fs.readFileSync("action.yml", "utf8");
              const runBlocks = action.split("run: |").slice(1);
              for (const blk of runBlocks) {
                const scriptSection = blk.split(/\n    - name:/)[0];
                assert.doesNotMatch(scriptSection, /\$\{\{\s*inputs\./, "Shell injection guard: inputs must pass via env only");
              }
              const wf = fs.readFileSync("examples/billing-watchdog.yml", "utf8");
              for (const line of wf.split("\n").filter((l) => /^\s*(-\s+)?if:/.test(l))) {
                assert.doesNotMatch(line, /secrets\./, "Workflow if: must not reference secrets directly");
              }
              console.log("Public Portal & Composite Action CI Gate PASSED on Node " + process.version);
            '
            node scripts/public-ci-gate.mjs lint-sql --sql-file examples/bad-migration.sql --no-fail-on-critical --sarif-out /tmp/public-gate.sarif --agent-fix-out /tmp/public-agent-fix.md
            node -e '
              const fs = require("node:fs");
              const assert = require("node:assert/strict");
              const sarif = JSON.parse(fs.readFileSync("/tmp/public-gate.sarif", "utf8"));
              assert.equal(sarif.version, "2.1.0");
              assert.equal(sarif.runs.length, 1);
              assert.equal(sarif.runs[0].results.length, 5);
              for (const r of sarif.runs[0].results) {
                const loc = r.locations[0].physicalLocation;
                assert.equal(loc.artifactLocation.uri, "examples/bad-migration.sql");
                assert.ok(loc.region.startLine > 1);
              }
              const agentFix = fs.readFileSync("/tmp/public-agent-fix.md", "utf8");
              assert.match(agentFix, /UNTRUSTED DATA/);
              assert.match(agentFix, /REDACTED IN FREE DIAGNOSTIC MODE/);
              assert.match(agentFix, /examples\/bad-migration\.sql:35/);
              console.log("Public SARIF 2.1.0 + Agent Fix Packet Smoke Gate PASSED (" + sarif.runs[0].results.length + " annotations)");
            '
          fi
